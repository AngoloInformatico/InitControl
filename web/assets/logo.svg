<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8FFA8"/>
      <stop offset="50%" stop-color="#D4F86A"/>
      <stop offset="100%" stop-color="#9ED626"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="#0d141e" stroke="url(#limeGrad)" stroke-width="2.5" />
  <!-- Inner tech ring -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#D4F86A" stroke-width="1" stroke-dasharray="3, 4" opacity="0.4"/>
  <!-- Thruster flame -->
  <polygon points="45,66 55,66 50,84" fill="#D4F86A" opacity="0.9" filter="url(#glow)"/>
  <!-- Left fin -->
  <polygon points="43,56 26,68 28,73 42,67" fill="#88B81E" stroke="#D4F86A" stroke-width="1"/>
  <!-- Right fin -->
  <polygon points="57,56 74,68 72,73 58,67" fill="#88B81E" stroke="#D4F86A" stroke-width="1"/>
  <!-- Fuselage -->
  <polygon points="50,20 60,45 58,65 42,65 40,45" fill="#F0F6FC" stroke="#D4F86A" stroke-width="1.8"/>
  <polygon points="50,20 60,45 58,65 50,65" fill="#D0DBE5"/>
  <!-- Reactor core -->
  <circle cx="50" cy="51" r="5.5" fill="#0d141e" stroke="#D4F86A" stroke-width="1.5"/>
  <circle cx="50" cy="51" r="3" fill="#D4F86A" filter="url(#glow)"/>
  <!-- Chevron -->
  <polygon points="50,28 54,35 52,36 50,33 48,36 46,35" fill="#D4F86A"/>
</svg>
